[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcat"
version = "0.1.0"
description = "DCAT - Dynamic Cross-Attention Transformer for conditional multimodal email spam detection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DCAT Research" }]
keywords = [
    "email-spam-detection",
    "multimodal",
    "cross-attention",
    "transformer",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Email",
]

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "polars>=0.20",

    # ML frameworks
    "torch>=2.2",
    "transformers>=4.38",
    "timm>=1.0",

    # Preprocessing
    "pillow>=10.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # Configuration & experiment management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.9",
    "optuna>=3.5",

    # Data versioning & storage
    "dvc>=3.0",
    "pyarrow>=15.0",

    # ML utilities
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.scripts]
dcat-env = "dcat.scripts.env_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dcat = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -q"
markers = [
    "gpu: marks tests that require a GPU (deselect with '-m \"not gpu\"')",
    "slow: marks slow integration tests (deselect with '-m \"not slow\"')",
    "integration: marks end-to-end integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 110
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = "notebooks/"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "N",   # pep8 naming
]
ignore = [
    "E501",  # line too long - we rely on black for formatting
    "N999",  # invalid module name - package uses dcat naming
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
